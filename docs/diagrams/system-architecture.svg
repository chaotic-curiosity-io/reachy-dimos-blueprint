<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 710" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>System architecture: Reachy Mini and its sensors stream to the station, which runs dimOS and sends drive commands back to the ESP32 base</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="710" fill="#f7f9fc"/>
  <text x="530" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Reachy × dimOS — dataflow</text>

  <!-- ============ ROBOT SIDE ============ -->
  <rect x="26" y="62" width="358" height="560" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="86" font-size="12" font-weight="700" letter-spacing="1" fill="#64748b">ON THE CHASSIS</text>

  <!-- Reachy Mini -->
  <rect x="46" y="100" width="318" height="168" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="205" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Reachy Mini</text>
  <text x="205" y="144" text-anchor="middle" font-size="12.5" fill="#1e3a8a">head RGB camera (mono, 1280×720)</text>
  <rect x="60" y="156" width="290" height="100" rx="6" fill="#ffffff" stroke="#1e40af" stroke-width="1"/>
  <text x="205" y="175" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">robot apps — HTTP :8042 (one at a time)</text>
  <text x="205" y="195" text-anchor="middle" font-size="12" fill="#334155">dimos_scanner — frame + pose streamer</text>
  <text x="205" y="213" text-anchor="middle" font-size="12" fill="#334155">reachy_wheels_app — D-pad, person following,</text>
  <text x="205" y="231" text-anchor="middle" font-size="12" fill="#334155">Gemini voice tiers: look → turn_body → drive</text>
  <text x="205" y="249" text-anchor="middle" font-size="11" fill="#64748b">(robot daemon :8000 — app lifecycle, head pose)</text>

  <!-- Pi + L515 -->
  <rect x="86" y="300" width="278" height="78" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="225" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Raspberry Pi + RealSense L515</text>
  <text x="225" y="344" text-anchor="middle" font-size="12" fill="#14532d">depth server — HTTP :8765, pull-based</text>
  <text x="225" y="362" text-anchor="middle" font-size="11.5" fill="#3f6212">measured depth, 640×480 @ 30 Hz capture</text>

  <!-- ESP32 base -->
  <rect x="46" y="452" width="318" height="140" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="205" y="477" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">ESP32 mecanum base</text>
  <text x="205" y="497" text-anchor="middle" font-size="12" fill="#78350f">HTTP :80 — JSON POST /cmd</text>
  <text x="205" y="516" text-anchor="middle" font-size="12" fill="#78350f">2 s deadman: no command → wheels stop</text>
  <text x="205" y="535" text-anchor="middle" font-size="12" fill="#78350f">2× L298N → 4 TT motors, mecanum X config</text>
  <text x="205" y="556" text-anchor="middle" font-size="11" fill="#92400e">own battery — meets the Reachy only</text>
  <text x="205" y="572" text-anchor="middle" font-size="11" fill="#92400e">mechanically and over WiFi</text>

  <!-- wheels app -> base -->
  <path d="M 66 268 L 66 452" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="78" y="404" font-size="11.5" fill="#334155">HTTP JSON /cmd</text>
  <text x="78" y="420" font-size="11.5" fill="#334155">follow + voice drive</text>

  <!-- ============ STATION SIDE ============ -->
  <rect x="476" y="62" width="562" height="560" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="494" y="86" font-size="12" font-weight="700" letter-spacing="1" fill="#64748b">ON THE STATION (MAC or DGX SPARK)</text>

  <!-- bridge + pipeline -->
  <rect x="496" y="100" width="522" height="168" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="757" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Mono path — dimos_bridge server + dimOS fork pipeline</text>
  <text x="757" y="143" text-anchor="middle" font-size="12" fill="#4c1d95">WS :9876 default — scan.sh uses :9879 (Rerun gRPC also claims 9876)</text>
  <rect x="510" y="158" width="116" height="56" rx="5" fill="#ffffff" stroke="#5b21b6"/>
  <text x="568" y="181" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c1d95">DepthPro</text>
  <text x="568" y="197" text-anchor="middle" font-size="11" fill="#64748b">metric depth</text>
  <rect x="640" y="158" width="116" height="56" rx="5" fill="#ffffff" stroke="#5b21b6"/>
  <text x="698" y="181" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c1d95">visual odometry</text>
  <text x="698" y="197" text-anchor="middle" font-size="11" fill="#64748b">+ kinematic pose</text>
  <rect x="770" y="158" width="110" height="56" rx="5" fill="#ffffff" stroke="#5b21b6"/>
  <text x="825" y="181" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c1d95">ObjectDB</text>
  <text x="825" y="197" text-anchor="middle" font-size="11" fill="#64748b">detections</text>
  <rect x="894" y="158" width="110" height="56" rx="5" fill="#ffffff" stroke="#5b21b6"/>
  <text x="949" y="181" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c1d95">SpatialMemory</text>
  <text x="949" y="197" text-anchor="middle" font-size="11" fill="#64748b">remembered surfaces</text>
  <path d="M 626 186 L 640 186" fill="none" stroke="#5b21b6" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 756 186 L 770 186" fill="none" stroke="#5b21b6" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 880 186 L 894 186" fill="none" stroke="#5b21b6" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="757" y="248" text-anchor="middle" font-size="11" fill="#7c3aed">depth models run here — the robot only streams JPEG</text>

  <!-- Rerun -->
  <rect x="769" y="300" width="249" height="58" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
  <text x="893" y="324" text-anchor="middle" font-size="13.5" font-weight="700" fill="#881337">Rerun viewer</text>
  <text x="893" y="343" text-anchor="middle" font-size="11.5" fill="#881337">live 3D map, labels, point clouds</text>
  <path d="M 949 214 L 949 300" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- l515 stack -->
  <rect x="496" y="408" width="522" height="150" rx="8" fill="#cffafe" stroke="#155e75" stroke-width="1.5"/>
  <text x="757" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#164e63">RGB-D path — station/l515 stack</text>
  <text x="757" y="452" text-anchor="middle" font-size="12" fill="#164e63">calibrated RGB-D clouds · continuous mapping · perception</text>
  <text x="757" y="471" text-anchor="middle" font-size="12" fill="#164e63">web UI :8777 · Rerun web :8778 · Rerun gRPC :9878</text>
  <text x="757" y="491" text-anchor="middle" font-size="12" fill="#164e63">dimOS VoxelGrid · OccupancyGrid + A* planner</text>
  <text x="757" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">navigation stays DRY-RUN — no base calibration yet;</text>
  <text x="757" y="529" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">wheel-moving scripts require an explicit --execute</text>

  <!-- calibration input -->
  <rect x="700" y="588" width="300" height="46" rx="6" fill="#ffffff" stroke="#155e75" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="850" y="607" text-anchor="middle" font-size="11.5" fill="#164e63">camera ↔ depth extrinsics (ChArUco)</text>
  <text x="850" y="623" text-anchor="middle" font-size="11" fill="#64748b">perception/calibration — paired-extrinsics-report.json</text>
  <path d="M 850 588 L 850 558" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowdim)"/>

  <!-- ============ CROSS WIRES ============ -->
  <!-- WS frames/pose -->
  <path d="M 364 150 L 496 150" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="430" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">WebSocket</text>
  <text x="430" y="133" text-anchor="middle" font-size="10.5" fill="#334155">(binary protocol)</text>
  <text x="430" y="146" text-anchor="middle" font-size="10.5" fill="#334155">frames + pose 20 Hz →</text>
  <text x="430" y="168" text-anchor="middle" font-size="10.5" fill="#334155">← head-motion keys</text>

  <!-- head RGB to l515 stack -->
  <path d="M 364 232 L 452 232 L 452 436 L 496 436" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowdim)"/>
  <text x="444" y="260" text-anchor="end" font-size="11" fill="#64748b">HTTP · head RGB</text>
  <text x="444" y="275" text-anchor="end" font-size="11" fill="#64748b">/api/camera</text>

  <!-- RSPC point clouds -->
  <path d="M 364 352 L 420 352 L 420 492 L 496 492" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="412" y="380" text-anchor="end" font-size="11.5" font-weight="600" fill="#334155">HTTP pull</text>
  <text x="412" y="396" text-anchor="end" font-size="11" fill="#334155">RSPC binary</text>
  <text x="412" y="411" text-anchor="end" font-size="11" fill="#334155">point clouds</text>

  <!-- drive commands from station -->
  <path d="M 560 558 L 560 668 L 205 668 L 205 592" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="383" y="660" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">HTTP JSON /cmd — drive commands (dry-run gated)</text>
  <text x="383" y="690" text-anchor="middle" font-size="11" fill="#64748b">every path that would command the wheels from mapped geometry is gated on calibration</text>
</svg>
