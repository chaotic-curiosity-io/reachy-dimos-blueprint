<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 716" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>System architecture: the Reachy Mini and its depth sensor stream to the station, which runs dimOS, visualizes everything in Rerun, and sends drive commands back to the ESP32 base</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b21b6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="716" fill="#f7f9fc"/>
  <text x="580" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Reachy × dimOS — dataflow</text>

  <!-- ================= ON THE CHASSIS ================= -->
  <rect x="24" y="64" width="324" height="596" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="42" y="88" font-size="12" font-weight="700" letter-spacing="1" fill="#64748b">ON THE CHASSIS</text>

  <!-- Reachy Mini -->
  <rect x="44" y="104" width="284" height="132" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="186" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Reachy Mini</text>
  <text x="186" y="147" text-anchor="middle" font-size="12.5" fill="#1e3a8a">head RGB camera · neck · mic</text>
  <rect x="58" y="158" width="256" height="66" rx="6" fill="#ffffff" stroke="#1e40af" stroke-width="1"/>
  <text x="186" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">robot apps · :8042</text>
  <text x="186" y="196" text-anchor="middle" font-size="11.5" fill="#334155">scanner — streams frames + pose</text>
  <text x="186" y="213" text-anchor="middle" font-size="11.5" fill="#334155">wheels — follow · voice · D-pad</text>

  <!-- Raspberry Pi + L515 -->
  <rect x="96" y="290" width="232" height="76" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="212" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Raspberry Pi + L515</text>
  <text x="212" y="334" text-anchor="middle" font-size="12" fill="#14532d">depth server · HTTP :8765</text>
  <text x="212" y="352" text-anchor="middle" font-size="11.5" fill="#3f6212">measured depth, 640×480</text>

  <!-- ESP32 base -->
  <rect x="44" y="440" width="284" height="124" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="186" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">ESP32 mecanum base</text>
  <text x="186" y="486" text-anchor="middle" font-size="12" fill="#78350f">HTTP :80 · POST /cmd</text>
  <text x="186" y="505" text-anchor="middle" font-size="12" fill="#78350f">2 s deadman → wheels stop</text>
  <text x="186" y="524" text-anchor="middle" font-size="12" fill="#78350f">2× L298N · 4 TT motors · mecanum X</text>
  <text x="186" y="547" text-anchor="middle" font-size="11" fill="#92400e">own battery — joins the Reachy over WiFi</text>

  <!-- wheels app -> base -->
  <path d="M 66 236 L 66 440" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="76" y="398" font-size="11" font-weight="600" fill="#334155">drive · /cmd</text>
  <text x="76" y="413" font-size="11" fill="#334155">follow + voice</text>

  <!-- ================= ON THE STATION ================= -->
  <rect x="520" y="64" width="616" height="596" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="538" y="88" font-size="12" font-weight="700" letter-spacing="1" fill="#64748b">ON THE STATION (MAC or DGX SPARK)</text>

  <!-- Mono path -->
  <rect x="540" y="104" width="576" height="188" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="828" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Mono path — dimOS bridge + pipeline</text>
  <text x="828" y="147" text-anchor="middle" font-size="12" fill="#4c1d95">WebSocket :9876 · scan.sh uses :9879</text>

  <rect x="554" y="160" width="124" height="76" rx="5" fill="#ffffff" stroke="#5b21b6"/>
  <text x="616" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Depth</text>
  <text x="616" y="197" text-anchor="middle" font-size="11" fill="#334155">DepthPro</text>
  <text x="616" y="212" text-anchor="middle" font-size="11" fill="#334155">Depth-Anything-3</text>
  <text x="616" y="227" text-anchor="middle" font-size="11" fill="#64748b">LingBot-Map*</text>

  <rect x="695" y="160" width="124" height="76" rx="5" fill="#ffffff" stroke="#5b21b6"/>
  <text x="757" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Pose</text>
  <text x="757" y="197" text-anchor="middle" font-size="11" fill="#334155">head kinematics</text>
  <text x="757" y="212" text-anchor="middle" font-size="11" fill="#334155">+ ICP to map</text>
  <text x="757" y="227" text-anchor="middle" font-size="11" fill="#64748b">or visual odometry</text>

  <rect x="836" y="160" width="124" height="76" rx="5" fill="#ffffff" stroke="#5b21b6"/>
  <text x="898" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">ObjectDB</text>
  <text x="898" y="197" text-anchor="middle" font-size="11" fill="#334155">detections</text>
  <text x="898" y="212" text-anchor="middle" font-size="11" fill="#334155">→ tracked objects</text>

  <rect x="977" y="160" width="124" height="76" rx="5" fill="#ffffff" stroke="#5b21b6"/>
  <text x="1039" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">SpatialMemory</text>
  <text x="1039" y="197" text-anchor="middle" font-size="11" fill="#334155">remembered</text>
  <text x="1039" y="212" text-anchor="middle" font-size="11" fill="#334155">surfaces + voxels</text>

  <path d="M 678 198 L 695 198" fill="none" stroke="#5b21b6" stroke-width="1.4" marker-end="url(#arrowpurple)"/>
  <path d="M 819 198 L 836 198" fill="none" stroke="#5b21b6" stroke-width="1.4" marker-end="url(#arrowpurple)"/>
  <path d="M 960 198 L 977 198" fill="none" stroke="#5b21b6" stroke-width="1.4" marker-end="url(#arrowpurple)"/>

  <text x="828" y="261" text-anchor="middle" font-size="10.5" fill="#6d28d9">* LingBot-Map reconstruction ran on a DGX Spark — not yet packaged in this repo</text>
  <text x="828" y="278" text-anchor="middle" font-size="10.5" fill="#6d28d9">depth models run on the station — the robot only streams JPEG</text>

  <!-- Rerun viewer: both paths feed it -->
  <rect x="896" y="318" width="220" height="58" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
  <text x="1006" y="342" text-anchor="middle" font-size="13.5" font-weight="700" fill="#881337">Rerun viewer</text>
  <text x="1006" y="361" text-anchor="middle" font-size="11.5" fill="#881337">live 3D map · labels · clouds</text>
  <path d="M 1006 292 L 1006 318" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 1006 414 L 1006 376" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- RGB-D path -->
  <rect x="540" y="414" width="576" height="140" rx="8" fill="#cffafe" stroke="#155e75" stroke-width="1.5"/>
  <text x="828" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#164e63">RGB-D path — L515 stack</text>
  <text x="828" y="460" text-anchor="middle" font-size="12" fill="#164e63">calibrated RGB-D · continuous mapping · perception</text>
  <text x="828" y="480" text-anchor="middle" font-size="12" fill="#164e63">dimOS VoxelGrid · OccupancyGrid · A* planner</text>
  <text x="828" y="500" text-anchor="middle" font-size="12" fill="#164e63">web UI :8777 · Rerun web :8778</text>
  <text x="828" y="532" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">navigation is a dry run — wheels move only with --execute</text>

  <!-- calibration input -->
  <rect x="836" y="582" width="280" height="52" rx="6" fill="#ffffff" stroke="#155e75" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="976" y="603" text-anchor="middle" font-size="11.5" font-weight="600" fill="#164e63">camera ↔ depth extrinsics</text>
  <text x="976" y="621" text-anchor="middle" font-size="10.5" fill="#64748b">ChArUco · perception/calibration</text>
  <path d="M 976 582 L 976 554" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowdim)"/>

  <!-- ================= CROSS WIRES ================= -->
  <!-- WebSocket: frames + pose out, head motion back -->
  <path d="M 328 136 L 540 136" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="434" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">WebSocket</text>
  <text x="434" y="127" text-anchor="middle" font-size="10.5" fill="#334155">frames + pose →</text>
  <text x="434" y="153" text-anchor="middle" font-size="10.5" fill="#334155">← head motion</text>

  <!-- head RGB to the RGB-D path -->
  <path d="M 328 212 L 490 212 L 490 446 L 540 446" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrowdim)"/>
  <text x="409" y="190" text-anchor="middle" font-size="10.5" fill="#64748b">head RGB</text>
  <text x="409" y="204" text-anchor="middle" font-size="10.5" fill="#64748b">HTTP /api/camera</text>

  <!-- point clouds to the RGB-D path -->
  <path d="M 328 330 L 440 330 L 440 500 L 540 500" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="396" y="308" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">point clouds</text>
  <text x="396" y="322" text-anchor="middle" font-size="10.5" fill="#334155">HTTP pull</text>

  <!-- drive commands back to the base -->
  <path d="M 600 554 L 600 694 L 186 694 L 186 564" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="393" y="686" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">drive commands · HTTP /cmd (dry-run gated)</text>
</svg>
